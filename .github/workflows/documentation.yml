name: Trigger documentation build

# Thin caller of the organization-wide documentation dispatcher in
# Cratis/Workflows/.github/workflows/trigger-documentation-build.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    # Dependency bumps (Update Dependencies runs on every Cratis release) do not change
    # what the documentation shows, so they do not rebuild it (Cratis/Documentation#198).
    paths-ignore:
      - "Directory.Packages.props"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/yarn.lock"
      - ".github/**"

permissions:
  contents: read

jobs:
  trigger:
    uses: Cratis/Workflows/.github/workflows/trigger-documentation-build.yml@main
    secrets:
      PAT_DOCUMENTATION: ${{ secrets.PAT_DOCUMENTATION }}
