name: Build Samples Solution

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dotnet:
    name: .NET samples
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Samples.slnx

      - name: Build Debug and generate proxies
        run: dotnet build Samples.slnx --configuration Debug --no-restore

      - name: Run focused Debug specifications
        run: |
          for project in \
            Arc/React/Arc.React.Specs/Arc.React.Specs.csproj \
            Chronicle/Backend/Backend.Specs/Backend.Specs.csproj \
            Chronicle/CrossStore/CrossStore.Specs/CrossStore.Specs.csproj \
            Chronicle/MultiTenancy/MultiTenancy.Specs/MultiTenancy.Specs.csproj \
            Chronicle/OperationsDiagnosis/OperationsDiagnosis.Specs/OperationsDiagnosis.Specs.csproj \
            Chronicle/Processing/Processing.Specs/Processing.Specs.csproj \
            Chronicle/Quickstart/Common.AspNetCore.Specs/Common.AspNetCore.Specs.csproj
          do
            dotnet test "$project" --configuration Debug --verbosity normal
          done

      - name: Build Release without regenerating proxies
        run: dotnet build Samples.slnx --configuration Release --no-restore -p:CratisProxiesOutputPath=

  capstone-frontend:
    name: Frontend — Capstone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Capstone/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Generate Capstone proxies
        run: dotnet build Capstone/Capstone.csproj --configuration Debug

      - name: Install dependencies
        working-directory: Capstone
        run: npm ci

      - name: Lint Capstone
        working-directory: Capstone
        run: npm run lint

      - name: Type-check and build Capstone
        working-directory: Capstone
        run: npm run build

  frontend:
    name: Frontend — ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - Arc/React
          - Library/Lending
          - Library/Members

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Validate sample catalog
        run: yarn samples:validate

      - name: Lint ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: yarn lint:ci

      - name: Compile ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: yarn compile

      - name: Test ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: yarn test --passWithNoTests

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: yarn build
