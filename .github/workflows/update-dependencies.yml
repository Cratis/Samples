name: Update Dependencies

on:
  repository_dispatch:
    types: [update-dependencies]
  workflow_dispatch: # Allow manual trigger

# A burst of dispatches collapses into one run: each run updates every Cratis and Cratis.* package to the
# latest version, so a newer run supersedes an older one. Push retries below cover races inside a run.
concurrency:
  group: update-dependencies
  cancel-in-progress: true

jobs:
  update-nuget:

    name: Update NuGet Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for NuGet validation
        if: >
          github.event_name == 'repository_dispatch' &&
          github.event.action == 'update-dependencies'
        run: sleep 600

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pull latest changes
        run: git pull --rebase

      - name: Update Cratis and Cratis.* NuGet packages
        run: |
          # Get the Cratis umbrella package and all Cratis.* packages from Directory.Packages.props
          PACKAGES=$(grep -oP 'PackageVersion Include="\KCratis(?:\.[^"]+)?(?=")' Directory.Packages.props)

          # Update each package to latest version
          for package in $PACKAGES; do
            echo "Updating $package..."
            # Use NuGet API directly to get latest version
            LATEST=$(curl -s "https://api.nuget.org/v3-flatcontainer/${package,,}/index.json" | jq -r '.versions[-1]')
            if [ ! -z "$LATEST" ] && [ "$LATEST" != "null" ]; then
              echo "Latest version: $LATEST"
              # Update the version in Directory.Packages.props
              sed -i "s/PackageVersion Include=\"$package\" Version=\"[^\"]*\"/PackageVersion Include=\"$package\" Version=\"$LATEST\"/" Directory.Packages.props
            fi
          done

      - name: Commit NuGet updates
        id: commit-nuget
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Directory.Packages.props
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No NuGet package updates found"
          else
            git commit -m "chore: update Cratis and Cratis.* NuGet packages to latest versions"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push NuGet updates
        if: steps.commit-nuget.outputs.has_changes == 'true'
        run: .github/scripts/push-with-retry.sh

  update-npm:
    name: Update npm Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        folder:
          - Arc/React
          - Library/Lending
          - Library/Members
          - Capstone
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # Ensure we get the latest changes from the NuGet job

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Pull latest changes
        run: git pull --rebase

      # Resolve published release trains together, including exact cross-pins.
      # Capstone keeps its major caps and refreshes its lockfile transactionally.
      - name: Update @cratis/* packages in ${{ matrix.folder }}
        run: node .github/scripts/update-cratis-npm.mjs "${{ matrix.folder }}" ${{ matrix.folder == 'Capstone' && '--with-lockfile' || '' }}

      - name: Commit npm updates for ${{ matrix.folder }}
        id: commit-npm
        working-directory: ${{ matrix.folder }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json
          if [ "${{ matrix.folder }}" = "Capstone" ]; then
            git add package-lock.json
          fi
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No npm package updates found in ${{ matrix.folder }}"
          else
            git commit -m "chore: update @cratis/* npm packages in ${{ matrix.folder }} to latest versions"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push npm updates
        if: steps.commit-npm.outputs.has_changes == 'true'
        run: .github/scripts/push-with-retry.sh
