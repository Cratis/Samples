name: Update Dependencies

on:
  repository_dispatch:
    types: [update-dependencies]
  workflow_dispatch: # Allow manual trigger

# A burst of dispatches collapses into one pending run: each run updates every Cratis and Cratis.* package to the
# latest version, so GitHub keeping only the newest pending run is enough. A running update is never cancelled
# (that wasted the work done so far); push retries below cover races inside a run.
concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update-nuget:

    name: Update NuGet Packages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for NuGet validation
        if: >
          github.event_name == 'repository_dispatch' &&
          github.event.action == 'update-dependencies'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/wait-for-nuget.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pull latest changes
        run: git pull --rebase

      - name: Update Cratis and Cratis.* NuGet packages
        run: |
          # Get the Cratis umbrella package and all Cratis.* packages from Directory.Packages.props
          PACKAGES=$(grep -oP 'PackageVersion Include="\KCratis(?:\.[^"]+)?(?=")' Directory.Packages.props)

          # Update each package to latest version
          for package in $PACKAGES; do
            echo "Updating $package..."
            # Use NuGet API directly to get latest version
            LATEST=$(curl -s "https://api.nuget.org/v3-flatcontainer/${package,,}/index.json" | jq -r '.versions[-1]')
            if [ ! -z "$LATEST" ] && [ "$LATEST" != "null" ]; then
              echo "Latest version: $LATEST"
              # Update the version in Directory.Packages.props
              sed -i "s/PackageVersion Include=\"$package\" Version=\"[^\"]*\"/PackageVersion Include=\"$package\" Version=\"$LATEST\"/" Directory.Packages.props
            fi
          done

      - name: Commit NuGet updates
        id: commit-nuget
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Directory.Packages.props
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No NuGet package updates found"
          else
            git commit -m "chore: update Cratis and Cratis.* NuGet packages to latest versions"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push NuGet updates
        if: steps.commit-nuget.outputs.has_changes == 'true'
        run: .github/scripts/push-with-retry.sh

  update-npm:
    name: Update npm Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # Ensure we get the latest changes from the NuGet job

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Pull latest changes
        run: git pull --rebase

      # Resolve published release trains together, including exact cross-pins.
      # Capstone keeps its major caps and refreshes its lockfile transactionally.
      - name: Update and commit @cratis/* npm packages
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          committed=false
          failed=""
          # Record the outcome even if the loop aborts, so folders already committed are still pushed.
          trap 'echo "committed=$committed" >> "$GITHUB_ENV"; echo "failed=$failed" >> "$GITHUB_ENV"' EXIT
          for folder in Arc/React Library/Lending Library/Members Capstone; do
            # A failing folder must not hold back the others; it fails the job after the push below.
            args=()
            if [ "$folder" = "Capstone" ]; then
              args=(--with-lockfile)
            fi
            if ! node .github/scripts/update-cratis-npm.mjs "$folder" "${args[@]}"; then
              echo "::error::Updating @cratis/* npm packages in $folder failed"
              failed="$failed $folder"
              git checkout -- "$folder"
              continue
            fi
            git add "$folder/package.json"
            if [ "$folder" = "Capstone" ]; then
              git add "$folder/package-lock.json"
            fi
            if git diff --staged --quiet; then
              echo "No npm package updates found in $folder"
            else
              git commit -m "chore: update @cratis/* npm packages in $folder to latest versions"
              committed=true
            fi
          done

      - name: Push npm updates
        if: ${{ !cancelled() && env.committed == 'true' }}
        run: .github/scripts/push-with-retry.sh

      - name: Fail when a folder could not be updated
        if: env.failed != ''
        run: |
          echo "::error::npm updates failed in:${failed}"
          exit 1
