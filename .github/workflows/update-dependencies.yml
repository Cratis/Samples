name: Update Dependencies

on:
  repository_dispatch:
    types: [update-dependencies]
  workflow_dispatch: # Allow manual trigger

# Serialize overlapping runs; max-parallel and push retries below cover races inside a run.
concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update-nuget:

    name: Update NuGet Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for NuGet validation
        if: >
          github.event_name == 'repository_dispatch' &&
          github.event.action == 'update-dependencies'
        run: sleep 600

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pull latest changes
        run: git pull --rebase

      - name: Update Cratis.* NuGet packages
        run: |
          # Get all Cratis.* packages from Directory.Packages.props
          PACKAGES=$(grep -oP 'PackageVersion Include="Cratis\.\K[^"]+' Directory.Packages.props | sed 's/^/Cratis./')

          # Update each package to latest version
          for package in $PACKAGES; do
            echo "Updating $package..."
            # Use NuGet API directly to get latest version
            LATEST=$(curl -s "https://api.nuget.org/v3-flatcontainer/${package,,}/index.json" | jq -r '.versions[-1]')
            if [ ! -z "$LATEST" ] && [ "$LATEST" != "null" ]; then
              echo "Latest version: $LATEST"
              # Update the version in Directory.Packages.props
              sed -i "s/PackageVersion Include=\"$package\" Version=\"[^\"]*\"/PackageVersion Include=\"$package\" Version=\"$LATEST\"/" Directory.Packages.props
            fi
          done

      - name: Commit NuGet updates
        id: commit-nuget
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Directory.Packages.props
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No NuGet package updates found"
          else
            git commit -m "chore: update Cratis.* NuGet packages to latest versions"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push NuGet updates
        if: steps.commit-nuget.outputs.has_changes == 'true'
        run: .github/scripts/push-with-retry.sh

  update-npm:
    name: Update npm Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        folder:
          - Arc/React
          - Library/Lending
          - Library/Members
          - Capstone
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # Ensure we get the latest changes from the NuGet job

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Pull latest changes
        run: git pull --rebase

      - name: Update @cratis/* packages in ${{ matrix.folder }}
        if: matrix.folder != 'Capstone'
        working-directory: ${{ matrix.folder }}
        run: |
          # Get all @cratis/* packages from package.json
          PACKAGES=$(jq -r '.dependencies | keys[] | select(startswith("@cratis/"))' package.json)

          # Update each package to latest version
          for package in $PACKAGES; do
            echo "Updating $package..."
            if [ "$package" = "@cratis/components" ]; then
              # A new @cratis/components major needs a reviewed migration of the samples,
              # so stay on the major the samples are currently on.
              CURRENT=$(jq -r ".dependencies[\"$package\"]" package.json | sed -E 's/^[^0-9]*//')
              LATEST=$(npm view "$package@^$CURRENT" version --json 2>/dev/null | jq -r 'if type == "array" then (sort_by(split(".") | map(tonumber)) | last) elif type == "string" then . else empty end' || echo "")
            else
              LATEST=$(npm view "$package" version 2>/dev/null || echo "")
            fi
            if [ ! -z "$LATEST" ]; then
              echo "Latest version: $LATEST"
              # Update the version in package.json using jq
              jq ".dependencies[\"$package\"] = \"$LATEST\"" package.json > package.json.tmp
              mv package.json.tmp package.json
            fi
          done

      # Capstone uses npm's lockfile: update both manifests together so npm ci stays valid.
      - name: Update @cratis/* packages and lockfile in Capstone
        if: matrix.folder == 'Capstone'
        working-directory: Capstone
        run: |
          # A new @cratis/components major needs a reviewed migration of the samples,
          # so keep @cratis/components on the major the samples are currently on.
          # Every other @cratis/* package is updated to latest.
          install_specs() {
            jq -r --arg list "$1" '
              (.[$list] // {}) as $deps
              | ($deps["@cratis/components"] // "" | sub("^[^0-9]*"; "")) as $components
              | $deps | keys[] | select(startswith("@cratis/"))
              | if . == "@cratis/components" and $components != ""
                then . + "@^" + $components
                else . + "@latest"
                end' package.json
          }
          mapfile -t dependencies < <(install_specs dependencies)
          mapfile -t dev_dependencies < <(install_specs devDependencies)
          if [ ${#dependencies[@]} -gt 0 ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund "${dependencies[@]}"
          fi
          if [ ${#dev_dependencies[@]} -gt 0 ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev "${dev_dependencies[@]}"
          fi

      - name: Commit npm updates for ${{ matrix.folder }}
        id: commit-npm
        working-directory: ${{ matrix.folder }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json
          if [ "${{ matrix.folder }}" = "Capstone" ]; then
            git add package-lock.json
          fi
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No npm package updates found in ${{ matrix.folder }}"
          else
            git commit -m "chore: update @cratis/* npm packages in ${{ matrix.folder }} to latest versions"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push npm updates
        if: steps.commit-npm.outputs.has_changes == 'true'
        run: .github/scripts/push-with-retry.sh
