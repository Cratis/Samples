name: Update Packages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    uses: Cratis/Workflows/.github/workflows/update-packages.yml@main
    with:
      # Components 4 removed APIs these samples require; keep the supported 3.x line.
      npm-package-exclusions: typescript,@cratis/components
    secrets:
      PAT_WORKFLOWS: ${{ secrets.PAT_WORKFLOWS }}
