name: Update Packages

# No schedule here on purpose: Samples already receives dependency updates through
# the repository_dispatch driven "Update Dependencies" workflow every time an
# upstream Cratis package publishes (21 bot commits in the last week alone). The
# daily cron on top of that was redundant load. Manual dispatch remains available.
on:
  workflow_dispatch:

jobs:
  update:
    uses: Cratis/Workflows/.github/workflows/update-packages.yml@main
    secrets:
      PAT_WORKFLOWS: ${{ secrets.PAT_WORKFLOWS }}
