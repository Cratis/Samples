services:
  mongodb:
    image: mongo:8.2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongodb-init:
    image: mongo:8.2
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    command:
      - mongosh
      - --host
      - mongodb
      - --quiet
      - --eval
      - |
        const status = db.adminCommand({ replSetGetStatus: 1 });
        if (status.code === 94) {
          const result = rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] });
          if (!result.ok) { throw new Error(JSON.stringify(result)); }
        } else if (!status.ok) { throw new Error(JSON.stringify(status)); }

  chronicle:
    image: cratis/chronicle:19.59.4
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    environment:
      Cratis__Chronicle__Storage__Type: MongoDB
      Cratis__Chronicle__Storage__ConnectionDetails: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      Cratis__Chronicle__Tls__CertificatePath: /certs/chronicle.pfx
      Cratis__Chronicle__Tls__CertificatePassword: ${CHRONICLE_CERTIFICATE_PASSWORD:?Set CHRONICLE_CERTIFICATE_PASSWORD, see README}
      Cratis__Chronicle__EncryptionCertificate__CertificatePath: /certs/encryption.pfx
      Cratis__Chronicle__EncryptionCertificate__CertificatePassword: ${ENCRYPTION_CERTIFICATE_PASSWORD:?Set ENCRYPTION_CERTIFICATE_PASSWORD, see README}
      Cratis__Chronicle__Clients__0__ClientId: cart-api
      Cratis__Chronicle__Clients__0__ClientSecret: ${CHRONICLE_CLIENT_SECRET:?Set CHRONICLE_CLIENT_SECRET, see README}
      Cratis__Chronicle__Authentication__AdminUser__Username: admin
      Cratis__Chronicle__Authentication__AdminUser__Password: ${CHRONICLE_ADMIN_PASSWORD:?Set CHRONICLE_ADMIN_PASSWORD, see README}
      Cratis__Chronicle__Authentication__AdminUser__Email: admin@example.invalid
      Cratis__Chronicle__Authentication__AdminUser__RequirePasswordChangeOnFirstLogin: "true"
      Cratis__Chronicle__Health__Port: "8080"
      Cratis__Chronicle__Health__Tls: "false"
      Cratis__Chronicle__Health__Exclusive: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: cart-chronicle
    volumes:
      - ./certs/chronicle.pfx:/certs/chronicle.pfx:ro
      - ./certs/encryption.pfx:/certs/encryption.pfx:ro
    ports:
      - "127.0.0.1:35008:35000"
      - "127.0.0.1:18080:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start", "--import-realm"]
    environment:
      KC_HOSTNAME: https://localhost:8443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTPS_CERTIFICATE_FILE: /certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/tls.key
      KC_DB: dev-file
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD, see README}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:?Set DEMO_CUSTOMER_PASSWORD, see README}
      DEMO_VISITOR_PASSWORD: ${DEMO_VISITOR_PASSWORD:?Set DEMO_VISITOR_PASSWORD, see README}
    volumes:
      - ./certs/tls.crt:/certs/tls.crt:ro
      - ./certs/tls.key:/certs/tls.key:ro
      - ./keycloak/cart-realm.json:/opt/keycloak/data/import/cart-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8443:8443"

  api:
    build:
      context: ../..
      dockerfile: LearningPath/08-Production/Dockerfile
    depends_on:
      - chronicle
      - keycloak
      - aspire-dashboard
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Cratis__Chronicle__ConnectionString: chronicle://cart-api:${CHRONICLE_CLIENT_SECRET_URI:?Set CHRONICLE_CLIENT_SECRET_URI, see README}@chronicle:35000?skipTlsValidation=false
      Cratis__Chronicle__EventStore: LearningPathProduction
      Authentication__Authority: https://localhost:8443/realms/cart
      Authentication__MetadataAddress: https://keycloak:8443/realms/cart/.well-known/openid-configuration
      Authentication__Audience: cart-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: production-cart
    ports:
      - "127.0.0.1:5108:8080"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.1
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      DOTNET_DASHBOARD_OTLP_AUTHMODE: Unsecured
      Dashboard__Mcp__EndpointUrl: http://0.0.0.0:18890
      Dashboard__Mcp__AuthMode: Unsecured
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:18890:18890"

volumes:
  mongodb-data:
  keycloak-data:
